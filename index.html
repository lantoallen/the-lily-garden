<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Coquette Bloom Box</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
    <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,400;0,600;1,400;1,600&family=Quicksand:wght@400;500;600&display=swap" rel="stylesheet">
    
    <style>
        :root {
            /* Light Theme (Daylight Coquette) */
            --bg-main: #fdf5f6;
            --bg-pattern: #f7dcd9;
            --panel-bg: rgba(255, 255, 255, 0.95);
            --text-main: #5c3a41;
            --text-muted: #8c6b73;
            --accent-pink: #d16b8a;
            --accent-light: #ffb6c1;
            --border-lace: #fce4ec;
            --shadow-color: rgba(230, 180, 190, 0.3);
            --lace-glow: none;
            --pearl-color: #fff;
            --pearl-shadow: rgba(0,0,0,0.1);
        }

        [data-theme="dark"] {
            /* Dark Theme (Midnight Coquette) */
            --bg-main: #140d1a;
            --bg-pattern: #2a1b38;
            --panel-bg: rgba(30, 20, 40, 0.95);
            --text-main: #f0e6f5;
            --text-muted: #bda6c9;
            --accent-pink: #b388eb;
            --accent-light: #8e62c9;
            --border-lace: #452b59;
            --shadow-color: rgba(179, 136, 235, 0.15);
            --lace-glow: 0 0 12px rgba(179, 136, 235, 0.4);
            --pearl-color: #2a1b38;
            --pearl-shadow: rgba(179, 136, 235, 0.5);
        }

        * { box-sizing: border-box; margin: 0; padding: 0; }

        body {
            background-color: var(--bg-main);
            background-image: radial-gradient(var(--bg-pattern) 2px, transparent 2px);
            background-size: 30px 30px;
            font-family: 'Quicksand', sans-serif;
            color: var(--text-main);
            overflow-x: hidden;
            transition: background-color 0.5s, color 0.5s;
        }

        .app-container {
            display: flex;
            flex-wrap: wrap;
            min-height: 100vh;
            max-width: 1400px;
            margin: 0 auto;
        }

        /* Top Bar */
        .top-bar {
            position: fixed;
            top: 20px;
            right: 20px;
            z-index: 100;
        }

        .theme-toggle {
            background: var(--panel-bg);
            border: 1px solid var(--border-lace);
            color: var(--text-main);
            padding: 8px 16px;
            border-radius: 20px;
            cursor: pointer;
            font-family: inherit;
            font-weight: 600;
            box-shadow: 0 4px 10px var(--shadow-color);
            transition: all 0.3s ease;
        }

        .controls {
            width: 100%;
            max-width: 420px;
            background: var(--panel-bg);
            padding: 2.5rem;
            border-right: 2px dashed var(--border-lace);
            box-shadow: 10px 0 30px var(--shadow-color);
            z-index: 10;
            display: flex;
            flex-direction: column;
            gap: 1.5rem;
            overflow-y: auto;
            max-height: 100vh;
            backdrop-filter: blur(5px);
            transition: all 0.5s;
        }

        .controls h2 {
            font-family: 'Playfair Display', serif;
            font-size: 2.2rem;
            font-style: italic;
            color: var(--accent-pink);
            transition: color 0.5s;
        }

        .control-group {
            background: rgba(255, 255, 255, 0.05);
            padding: 1.2rem;
            border-radius: 12px;
            border: 1px solid var(--border-lace);
        }

        .control-group label {
            display: block;
            font-weight: 600;
            margin-bottom: 0.8rem;
            color: var(--text-muted);
            font-size: 0.9rem;
            text-transform: uppercase;
            letter-spacing: 1px;
        }

        /* Grid & Buttons */
        .btn-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 10px;
        }

        button.tool-btn {
            padding: 12px;
            border: 1px solid var(--border-lace);
            border-radius: 20px;
            background: transparent;
            cursor: pointer;
            font-family: inherit;
            font-weight: 600;
            color: var(--text-main);
            transition: all 0.2s cubic-bezier(0.175, 0.885, 0.32, 1.2);
        }

        button.tool-btn:hover {
            transform: translateY(-3px) scale(1.02);
            box-shadow: 0 6px 12px var(--shadow-color);
            border-color: var(--accent-pink);
        }

        .btn-primary {
            background: var(--accent-light);
            color: #fff;
            border: none;
            grid-column: span 2;
            font-size: 1.1rem;
            box-shadow: 0 4px 10px var(--shadow-color);
        }

        .btn-primary:hover {
            background: var(--accent-pink);
        }

        input[type="color"] {
            width: 100%;
            height: 45px;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            background: transparent;
        }

        textarea {
            width: 100%;
            height: 70px;
            padding: 12px;
            border: 1px solid var(--border-lace);
            border-radius: 8px;
            font-family: inherit;
            resize: none;
            background: rgba(255,255,255,0.1);
            color: var(--text-main);
        }

        textarea:focus {
            outline: none;
            border-color: var(--accent-pink);
        }

        /* Capacity Pearls */
        .capacity-container {
            margin-top: 5px;
        }
        .pearl-string {
            display: flex;
            gap: 6px;
            margin-top: 8px;
            flex-wrap: wrap;
        }
        .pearl {
            width: 12px;
            height: 12px;
            background: var(--pearl-color);
            border-radius: 50%;
            box-shadow: inset -2px -2px 4px rgba(0,0,0,0.1), 0 2px 4px var(--pearl-shadow);
            opacity: 0.3;
            transition: opacity 0.3s, transform 0.3s;
        }
        .pearl.filled {
            opacity: 1;
            background: var(--accent-pink);
            box-shadow: inset -2px -2px 4px rgba(0,0,0,0.2), 0 0 8px var(--accent-pink);
        }
        .shake {
            animation: shake 0.4s cubic-bezier(.36,.07,.19,.97) both;
        }
        @keyframes shake {
            10%, 90% { transform: translate3d(-1px, 0, 0); }
            20%, 80% { transform: translate3d(2px, 0, 0); }
            30%, 50%, 70% { transform: translate3d(-3px, 0, 0); }
            40%, 60% { transform: translate3d(3px, 0, 0); }
        }

        .canvas-area {
            flex: 1;
            display: flex;
            align-items: center;
            justify-content: center;
            position: relative;
            min-height: 100vh;
            padding: 2rem;
        }

        .export-frame {
            position: relative;
            width: 100%;
            max-width: 500px;
            height: 600px;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: flex-end;
            padding-bottom: 60px;
        }

        .flower-vase {
            position: absolute;
            bottom: 200px;
            width: 300px;
            height: 350px;
            z-index: 10;
        }

        /* 3D Wrapping Paper */
        .wrapper-back {
            position: absolute;
            bottom: 40px;
            width: 0;
            height: 0;
            border-left: 130px solid transparent;
            border-right: 130px solid transparent;
            border-top: 260px solid rgba(0,0,0,0.1);
            border-radius: 10px;
            z-index: 1;
            filter: drop-shadow(0 -5px 10px rgba(0,0,0,0.05));
        }

        .wrapper-front {
            position: absolute;
            bottom: 20px;
            width: 0;
            height: 0;
            border-left: 160px solid transparent;
            border-right: 160px solid transparent;
            border-top: 300px solid #ffe4e1;
            border-radius: 15px;
            z-index: 20;
            filter: drop-shadow(0 20px 30px var(--shadow-color));
            transition: border-top-color 0.4s;
            pointer-events: none; /* Let clicks pass to vase if needed */
        }

        .wrapper-front::after {
            content: '';
            position: absolute;
            top: -310px;
            left: -160px;
            width: 320px;
            height: 25px;
            background-image: radial-gradient(circle at 12px 0, transparent 12px, var(--bg-main) 13px);
            background-size: 24px 24px;
            background-repeat: repeat-x;
            z-index: 21;
            filter: drop-shadow(var(--lace-glow));
            transition: background-image 0.5s;
        }

        .bow {
            position: absolute;
            top: -260px;
            left: -45px;
            font-size: 5rem;
            z-index: 22;
            filter: drop-shadow(0 5px 10px rgba(0,0,0,0.2));
            pointer-events: auto;
        }

        .draggable-item {
            position: absolute;
            font-size: 5rem;
            cursor: grab;
            user-select: none;
            touch-action: none; /* Crucial for mobile dragging */
            filter: drop-shadow(2px 5px 8px rgba(0,0,0,0.15));
            animation: popIn 0.5s cubic-bezier(0.175, 0.885, 0.32, 1.2) forwards;
            /* Center transform origin for rotation */
            transform-origin: center center;
            z-index: 15;
            will-change: transform;
        }

        .draggable-item:active {
            cursor: grabbing;
        }

        .draggable-item.main-event {
            font-size: 7.5rem;
            filter: drop-shadow(4px 10px 12px rgba(0,0,0,0.2));
            z-index: 12; /* slightly behind smaller accents */
        }

        @keyframes popIn {
            0% { opacity: 0; transform: scale(0) translateY(30px); }
            100% { opacity: 1; transform: scale(1) translateY(0); }
        }

        .gift-tag {
            position: absolute;
            top: -160px;
            left: 60px;
            background: var(--panel-bg);
            padding: 20px;
            width: 160px;
            min-height: 90px;
            border-radius: 4px 4px 4px 20px;
            box-shadow: 2px 5px 20px var(--shadow-color);
            transform: rotate(8deg);
            border: 2px solid var(--border-lace);
            z-index: 25;
            display: flex;
            align-items: center;
            justify-content: center;
            pointer-events: auto;
        }

        .gift-tag p {
            font-family: 'Playfair Display', serif;
            font-style: italic;
            font-size: 1.2rem;
            color: var(--text-main);
            text-align: center;
            word-wrap: break-word;
        }

        /* Receiver Overlay */
        .receiver-overlay {
            display: none;
            position: absolute;
            top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0,0,0,0.4);
            backdrop-filter: blur(10px);
            z-index: 50;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            color: white;
            opacity: 1;
            transition: opacity 0.8s;
        }

        .receiver-overlay h1 {
            font-family: 'Playfair Display', serif;
            font-size: 3rem;
            margin-bottom: 2rem;
            text-shadow: 0 4px 15px rgba(0,0,0,0.5);
            text-align: center;
        }

        .untie-btn {
            background: #fff;
            color: var(--accent-pink);
            font-size: 1.5rem;
            padding: 15px 40px;
            border-radius: 30px;
            border: none;
            cursor: pointer;
            font-family: 'Playfair Display', serif;
            font-style: italic;
            font-weight: 600;
            box-shadow: 0 10px 25px rgba(0,0,0,0.3);
            transition: transform 0.3s;
            animation: pulse 2s infinite;
        }

        @keyframes pulse {
            0% { box-shadow: 0 0 0 0 rgba(255,255,255,0.7); }
            70% { box-shadow: 0 0 0 20px rgba(255,255,255,0); }
            100% { box-shadow: 0 0 0 0 rgba(255,255,255,0); }
        }

        .view-mode .controls { display: none; }
        .view-mode .top-bar { display: none; }
    </style>
</head>
<body>
    <div class="top-bar">
        <button class="theme-toggle" onclick="toggleTheme()">🌙 Midnight Mode</button>
    </div>

    <div class="app-container" id="app">
        
        <!-- SENDER UI: Control Panel -->
        <aside class="controls" id="controlPanel">
            <div>
                <h2>Build a Bouquet 🎀</h2>
                <p style="margin-top: 5px; color: var(--text-muted);">Drag and drop items to arrange them perfectly.</p>
            </div>
            
            <div class="control-group">
                <label>Main Event</label>
                <div class="btn-grid">
                    <button class="tool-btn btn-primary" onclick="addItem('🌸', true)">🌸 Pink Lily</button>
                    <button class="tool-btn btn-primary" onclick="addItem('⚜️', true)" style="background: rgba(255,255,255,0.5); color: var(--text-main);">⚜️ White Lily</button>
                </div>
            </div>

            <div class="control-group">
                <label>Coquette Accents</label>
                <div class="btn-grid">
                    <button class="tool-btn" onclick="addItem('🌹')">🌹 Rose</button>
                    <button class="tool-btn" onclick="addItem('🌷')">🌷 Tulip</button>
                    <button class="tool-btn" onclick="addItem('🐱')">🐱 Kitten</button>
                    <button class="tool-btn" onclick="addItem('🐶')">🐶 Puppy</button>
                    <button class="tool-btn" onclick="addItem('✨')">✨ Sparkles</button>
                    <button class="tool-btn" onclick="addItem('🎀')">🎀 Ribbon</button>
                </div>
            </div>

            <div class="control-group capacity-container">
                <label id="capacityLabel">Box Fullness: 0/15</label>
                <div class="pearl-string" id="pearlString">
                    <!-- Pearls generated by JS -->
                </div>
            </div>

            <div class="control-group">
                <label for="wrapColor">Wrapping Paper Color:</label>
                <input type="color" id="wrapColor" value="#ffe4e1" onchange="updateWrapperColor(); playCrinkle()">
            </div>

            <div class="control-group">
                <label for="giftMessage">Secret Message:</label>
                <textarea id="giftMessage" placeholder="You are the sweetest..." maxlength="45"></textarea>
            </div>
            
            <div class="btn-grid" style="margin-top: 10px;">
                <button class="tool-btn" style="background: var(--text-main); color: var(--bg-main);" onclick="generateShareLink()">💌 Copy Link</button>
                <button class="tool-btn" style="background: var(--text-main); color: var(--bg-main);" onclick="downloadImage()">📸 Save Image</button>
            </div>
            <button class="tool-btn" onclick="clearBouquet()" style="border: none; text-decoration: underline; background: transparent;">Start Over</button>
        </aside>

        <!-- VISUAL OUTPUT: The Canvas -->
        <main class="canvas-area">
            
            <!-- Receiver Unboxing Overlay -->
            <div class="receiver-overlay" id="receiverOverlay">
                <h1>A gift has arrived for you... 🎀</h1>
                <button class="untie-btn" onclick="untieBox()">Tap to Untie</button>
            </div>

            <div class="export-frame" id="exportFrame">
                <div class="wrapper-back" id="wrapperBack"></div>
                
                <!-- Droppable Area -->
                <div id="flowerVase" class="flower-vase">
                    <!-- Items injected and dragged here -->
                </div>
                
                <div id="wrapperFront" class="wrapper-front">
                    <div class="bow">🎀</div>
                    <div class="gift-tag">
                        <p id="tagText">For you...</p>
                    </div>
                </div>
            </div>
        </main>
    </div>

    <script>
        const vase = document.getElementById('flowerVase');
        const wrapColorInput = document.getElementById('wrapColor');
        const wrapperFront = document.getElementById('wrapperFront');
        const wrapperBack = document.getElementById('wrapperBack');
        const messageInput = document.getElementById('giftMessage');
        const tagText = document.getElementById('tagText');
        const app = document.getElementById('app');
        const pearlString = document.getElementById('pearlString');
        const capacityLabel = document.getElementById('capacityLabel');
        const receiverOverlay = document.getElementById('receiverOverlay');

        const MAX_ITEMS = 15;
        let itemsData = []; // Array to store { id, emoji, isMain, x, y, rot }
        let itemCount = 0;
        let isDarkMode = false;

        // Initialize pearls
        for(let i=0; i<MAX_ITEMS; i++) {
            const pearl = document.createElement('div');
            pearl.className = 'pearl';
            pearlString.appendChild(pearl);
        }

        let audioCtx;
        function initAudio() {
            if (!audioCtx) {
                audioCtx = new (window.AudioContext || window.webkitAudioContext)();
            }
            if (audioCtx.state === 'suspended') {
                audioCtx.resume();
            }
        }

        function playPop() {
            if(!audioCtx) return;
            const osc = audioCtx.createOscillator();
            const gain = audioCtx.createGain();
            osc.type = 'sine';
            osc.frequency.setValueAtTime(300, audioCtx.currentTime);
            osc.frequency.exponentialRampToValueAtTime(600, audioCtx.currentTime + 0.1);
            gain.gain.setValueAtTime(0.5, audioCtx.currentTime);
            gain.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + 0.1);
            osc.connect(gain);
            gain.connect(audioCtx.destination);
            osc.start();
            osc.stop(audioCtx.currentTime + 0.1);
        }

        function playChime() {
            if(!audioCtx) return;
            const osc = audioCtx.createOscillator();
            const gain = audioCtx.createGain();
            osc.type = 'triangle';
            osc.frequency.setValueAtTime(1200, audioCtx.currentTime);
            osc.frequency.exponentialRampToValueAtTime(2000, audioCtx.currentTime + 0.3);
            gain.gain.setValueAtTime(0.3, audioCtx.currentTime);
            gain.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + 0.5);
            osc.connect(gain);
            gain.connect(audioCtx.destination);
            osc.start();
            osc.stop(audioCtx.currentTime + 0.5);
        }

        function playCrinkle() {
            if(!audioCtx) return;
            const bufferSize = audioCtx.sampleRate * 0.1; // 100ms
            const buffer = audioCtx.createBuffer(1, bufferSize, audioCtx.sampleRate);
            const data = buffer.getChannelData(0);
            for (let i = 0; i < bufferSize; i++) {
                data[i] = Math.random() * 2 - 1;
            }
            const noise = audioCtx.createBufferSource();
            noise.buffer = buffer;
            const filter = audioCtx.createBiquadFilter();
            filter.type = 'bandpass';
            filter.frequency.value = 4000;
            const gain = audioCtx.createGain();
            gain.gain.setValueAtTime(0.2, audioCtx.currentTime);
            gain.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + 0.1);
            noise.connect(filter);
            filter.connect(gain);
            gain.connect(audioCtx.destination);
            noise.start();
        }

        function updateCapacityUI() {
            capacityLabel.textContent = `Box Fullness: ${itemCount}/${MAX_ITEMS}`;
            const pearls = document.querySelectorAll('.pearl');
            pearls.forEach((p, index) => {
                if (index < itemCount) p.classList.add('filled');
                else p.classList.remove('filled');
            });
        }

        function addItem(emoji, isMain = false) {
            initAudio();
            if (itemCount >= MAX_ITEMS) {
                // Shake capacity indicator
                const capContainer = document.querySelector('.capacity-container');
                capContainer.classList.remove('shake');
                void capContainer.offsetWidth; // trigger reflow
                capContainer.classList.add('shake');
                return;
            }

            const id = 'item_' + Date.now() + '_' + Math.floor(Math.random()*1000);
            
            // Default random position inside vase
            const rangeX = isMain ? 40 : 100;
            const x = Math.floor(Math.random() * rangeX * 2) - rangeX;
            const y = Math.floor(Math.random() * 100) + 50; // default drop height
            const rot = Math.floor(Math.random() * 40) - 20;

            const data = { id, emoji, isMain, x, y, rot };
            itemsData.push(data);
            itemCount++;
            updateCapacityUI();
            
            renderItemElement(data);
            
            if(emoji === '✨') playChime();
            else playPop();
        }

        function renderItemElement(data) {
            const el = document.createElement('div');
            el.className = 'draggable-item';
            if (data.isMain) el.classList.add('main-event');
            el.id = data.id;
            el.textContent = data.emoji;
            
            // Apply positioning logic
            updateElementTransform(el, data.x, data.y, data.rot);
            vase.appendChild(el);
            
            // Setup Dragging
            makeDraggable(el, data);
        }

        function updateElementTransform(el, x, y, rot) {
            // Coordinate system: 0,0 is bottom center of vase
            el.style.left = `calc(50% + ${x}px)`;
            el.style.bottom = `${y}px`;
            el.style.transform = `translateX(-50%) rotate(${rot}deg)`;
        }

        function makeDraggable(el, dataRef) {
            let startX, startY, initialLeftOffset, initialBottomOffset;

            const onPointerDown = (e) => {
                if(app.classList.contains('view-mode')) return; // No dragging in receiver mode
                initAudio();
                e.preventDefault();
                const pointer = e.type.includes('touch') ? e.touches[0] : e;
                startX = pointer.clientX;
                startY = pointer.clientY;
                
                // Get current pixel offsets relative to vase
                const vaseRect = vase.getBoundingClientRect();
                const elRect = el.getBoundingClientRect();
                
                // Temporarily increase z-index while dragging
                el.style.zIndex = 50;

                document.addEventListener(e.type.includes('touch') ? 'touchmove' : 'mousemove', onPointerMove, {passive: false});
                document.addEventListener(e.type.includes('touch') ? 'touchend' : 'mouseup', onPointerUp);
            };

            const onPointerMove = (e) => {
                e.preventDefault();
                const pointer = e.type.includes('touch') ? e.touches[0] : e;
                const dx = pointer.clientX - startX;
                const dy = pointer.clientY - startY; // dy is positive when moving DOWN screen
                
                // update dataRef instantly
                dataRef.x += dx;
                dataRef.y -= dy; // subtract because bottom coordinate goes up
                
                startX = pointer.clientX;
                startY = pointer.clientY;
                
                updateElementTransform(el, dataRef.x, dataRef.y, dataRef.rot);
            };

            const onPointerUp = (e) => {
                // Reset z-index based on type
                el.style.zIndex = dataRef.isMain ? 12 : 15;
                document.removeEventListener('mousemove', onPointerMove);
                document.removeEventListener('mouseup', onPointerUp);
                document.removeEventListener('touchmove', onPointerMove);
                document.removeEventListener('touchend', onPointerUp);
                playPop(); // small feedback
            };

            el.addEventListener('mousedown', onPointerDown);
            el.addEventListener('touchstart', onPointerDown, {passive: false});
        }

        function updateWrapperColor() {
            const color = wrapColorInput.value;
            wrapperFront.style.borderTopColor = color;
            // Slightly darken for the back
            wrapperBack.style.borderTopColor = shadeColor(color, -20);
        }

        // Helper to darken hex colors
        function shadeColor(color, percent) {
            let R = parseInt(color.substring(1,3),16);
            let G = parseInt(color.substring(3,5),16);
            let B = parseInt(color.substring(5,7),16);
            R = parseInt(R * (100 + percent) / 100);
            G = parseInt(G * (100 + percent) / 100);
            B = parseInt(B * (100 + percent) / 100);
            R = (R<255)?R:255;  
            G = (G<255)?G:255;  
            B = (B<255)?B:255;  
            let RR = ((R.toString(16).length==1)?"0"+R.toString(16):R.toString(16));
            let GG = ((G.toString(16).length==1)?"0"+G.toString(16):G.toString(16));
            let BB = ((B.toString(16).length==1)?"0"+B.toString(16):B.toString(16));
            return "#"+RR+GG+BB;
        }

        messageInput.addEventListener('input', (e) => {
            tagText.textContent = e.target.value || 'For you...';
        });

        function clearBouquet() {
            vase.innerHTML = '';
            itemsData = [];
            itemCount = 0;
            updateCapacityUI();
            messageInput.value = '';
            tagText.textContent = 'For you...';
            wrapColorInput.value = '#ffe4e1';
            updateWrapperColor();
        }

        function toggleTheme() {
            isDarkMode = !isDarkMode;
            document.documentElement.setAttribute('data-theme', isDarkMode ? 'dark' : 'light');
            document.querySelector('.theme-toggle').textContent = isDarkMode ? '☀️ Daylight Mode' : '🌙 Midnight Mode';
        }

        function generateShareLink() {
            try {
                const payload = {
                    items: itemsData,
                    color: wrapColorInput.value,
                    msg: messageInput.value,
                    dark: isDarkMode
                };
                // Safe base64 encoding for emojis/unicode
                const encoded = btoa(unescape(encodeURIComponent(JSON.stringify(payload))));
                const shareUrl = `${window.location.origin}${window.location.pathname}?gift=${encoded}`;
                
                navigator.clipboard.writeText(shareUrl).then(() => {
                    alert("💌 Link copied! Send it to someone special. They will experience the unboxing animation.");
                });
            } catch (err) {
                alert("Error generating link.");
            }
        }

        function downloadImage() {
            const frame = document.getElementById('exportFrame');
            // Hide UI elements we don't want in screenshot if necessary
            html2canvas(frame, { backgroundColor: null, scale: 2 }).then(canvas => {
                const link = document.createElement('a');
                link.download = 'my-bloom-box.png';
                link.href = canvas.toDataURL('image/png');
                link.click();
            });
        }

        let receiverPayload = null;

        window.onload = () => {
            updateWrapperColor(); // set initial shades
            
            const params = new URLSearchParams(window.location.search);
            if (params.has('gift')) {
                app.classList.add('view-mode');
                receiverOverlay.style.display = 'flex';
                
                try {
                    receiverPayload = JSON.parse(decodeURIComponent(escape(atob(params.get('gift')))));
                    
                    // Apply saved environment state immediately
                    wrapColorInput.value = receiverPayload.color;
                    updateWrapperColor();
                    tagText.textContent = receiverPayload.msg || 'For you...';
                    if(receiverPayload.dark) toggleTheme();

                } catch(e) {
                    console.error("Invalid gift link", e);
                    receiverOverlay.innerHTML = "<h2>Oops, this gift link is broken.</h2>";
                }
            }
        };

        function untieBox() {
            initAudio();
            playCrinkle();
            
            // Fade out overlay
            receiverOverlay.style.opacity = '0';
            setTimeout(() => {
                receiverOverlay.style.display = 'none';
                
                // Animate items falling in
                if(receiverPayload && receiverPayload.items) {
                    receiverPayload.items.forEach((item, index) => {
                        setTimeout(() => {
                            renderItemElement(item);
                            if(item.emoji === '✨') playChime();
                            else playPop();
                        }, index * 250); // stagger animations
                    });
                }
            }, 800);
        }
    </script>
</body>
</html>
